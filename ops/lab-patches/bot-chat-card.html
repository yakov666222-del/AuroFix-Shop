<script>
/* היועץ בתוך כרטיס הצ'אט של הבוט: בעיצוב של המערכת, בלי לגעת בקוד של הבוט */
(function () {
  var U = "https://wu3f84yht5fm.ample.run/chat?key=<ADVISOR_KEY>&embed=1", ov = null, raf = 0;
  function findChatCard() {
    var ta = document.querySelector("#root textarea");
    if (!ta) return null;
    var el = ta;
    for (var i = 0; i < 12 && el && el !== document.body; i++) {
      el = el.parentElement;
      if (el && el.textContent && el.textContent.indexOf("שאל אותי על העסק") > -1) return el;
    }
    return null;
  }
  function build() {
    ov = document.createElement("div");
    ov.id = "yp-advisor-layer";
    ov.style.cssText = "position:fixed;z-index:40;overflow:hidden;display:none;flex-direction:column";
    ov.innerHTML = '<iframe src="' + U + '" title="היועץ" allowtransparency="true" style="flex:1;border:0;width:100%;background:transparent"></iframe>';
    document.body.appendChild(ov); // מחוץ לאזור של הבוט (#root)
  }
  function place() {
    raf = 0;
    var card = findChatCard();
    if (!card) { if (ov) ov.style.display = "none"; return; }
    if (!ov) build();
    var r = card.getBoundingClientRect();
    if (r.width < 50 || r.height < 50) { ov.style.display = "none"; return; }
    // מכסים את הכרטיס, ומאריכים עד מעל הסרגל התחתון
    var nav = 96, top = Math.max(r.top, 8), bottom = Math.max(r.bottom, window.innerHeight - nav);
    bottom = Math.min(bottom, window.innerHeight - nav);
    if (bottom - top < 220) { ov.style.display = "none"; return; }
    // מעתיקים את המראה של הכרטיס המקורי: רקע, מסגרת, פינות וצל
    var cs = getComputedStyle(card);
    ov.style.background = cs.backgroundColor !== "rgba(0, 0, 0, 0)" ? cs.background : "hsl(222 40% 13%)";
    ov.style.border = cs.borderTopWidth !== "0px" ? cs.borderTopWidth + " " + cs.borderTopStyle + " " + cs.borderTopColor : "1px solid hsl(40 35% 30%)";
    ov.style.borderRadius = cs.borderTopLeftRadius !== "0px" ? cs.borderTopLeftRadius : "1rem";
    ov.style.boxShadow = cs.boxShadow;
    ov.style.display = "flex";
    ov.style.left = r.left + "px";
    ov.style.width = r.width + "px";
    ov.style.top = top + "px";
    ov.style.height = (bottom - top) + "px";
  }
  function schedule() { if (!raf) raf = requestAnimationFrame(place); }
  new MutationObserver(schedule).observe(document.getElementById("root") || document.body, { childList: true, subtree: true });
  window.addEventListener("scroll", schedule, true);
  window.addEventListener("resize", schedule);
  setInterval(schedule, 700);
  schedule();
})();
</script>
